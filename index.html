<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost FX</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: #111821;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      color: #9ca3af;
      margin: 8px 0 0;
    }

    .container {
      padding: 15px;
      max-width: 700px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .status {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 15px;
    }

    .card {
      background: #111821;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .pair {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .price {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .data {
      color: #b8c0cc;
      font-size: 14px;
      line-height: 1.7;
    }

    .signal {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .buy {
      background: #14532d;
      color: #86efac;
    }

    .sell {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .wait {
      background: #374151;
      color: #d1d5db;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>👻 Ghost FX</h1>
    <p>M1 Scalping Scanner • EMA 50 • EMA 200 • RSI 14</p>
  </div>

  <div class="container">

    <button onclick="scanMarket()">SCAN MARKET</button>

    <div class="status" id="status">
      Starting Ghost FX...
    </div>

    <div id="results"></div>

  </div>

  <script>

    const API =
      "https://ghost-fx-api.olatundeolasunkanmi28.workers.dev";

    async function scanMarket() {

      const status = document.getElementById("status");
      const results = document.getElementById("results");

      status.innerText = "Scanning markets...";

      try {

        const response = await fetch(API + "/scan");
        const data = await response.json();

        if (!data.success) {
          throw new Error("Scanner error");
        }

        results.innerHTML = "";

        status.innerText =
          "Last scan: " + new Date().toLocaleTimeString();

        data.results.forEach(item => {

          const card = document.createElement("div");

          card.className = "card";

          let signalClass = "wait";

          if (item.signal === "BUY") {
            signalClass = "buy";
          }

          if (item.signal === "SELL") {
            signalClass = "sell";
          }

          card.innerHTML = `

            <div class="pair">
              ${item.symbol}
            </div>

            <div class="price">
              Price: ${item.price ?? "N/A"}
            </div>

            <div class="data">
              EMA 50: ${item.ema50 ?? "N/A"}<br>
              EMA 200: ${item.ema200 ?? "N/A"}<br>
              RSI 14: ${item.rsi14 ?? "N/A"}
            </div>

            <div class="signal ${signalClass}">
              ${item.signal}
            </div>

          `;

          results.appendChild(card);

        });

      } catch (error) {

        status.innerText =
          "Connection error — try scanning again.";

      }

    }

    // Initial scan
    scanMarket();

    // Automatic M1 scan every 60 seconds
    setInterval(() => {
      scanMarket();
    }, 60000);

  </script>

</body>
</html>
